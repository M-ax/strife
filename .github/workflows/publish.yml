name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for example 0.1.0 or 0.2.0-rc.1); uploads workflow artifacts only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-2025-vs2026
          - runtime: linux-x64
            os: ubuntu-24.04
          - runtime: osx-x64
            os: macos-15-intel
          - runtime: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6
      - name: Validate version and runner
        run: |
          . ./scripts/release-common.ps1
          $version = Get-StrifeVersion $env:RELEASE_VERSION
          if ((Get-StrifeRuntime) -ne '${{ matrix.runtime }}') { throw 'Runner architecture does not match the release target.' }
          "STRIFE_VERSION=$version" >> $env:GITHUB_ENV
      # Check the small, runnable payload before installing or restoring native build tools.
      # Keep this key independent of app versions, managed/UI code and packaging changes.
      - name: Restore compiled Mumble engine
        id: voice-cache
        uses: actions/cache/restore@v5
        with:
          path: artifacts/voice
          key: voice-${{ matrix.runtime }}-${{ hashFiles('native/**', 'scripts/build-voice.ps1', 'scripts/prepare-release.ps1', 'packaging/native-dependencies.json') }}
      - name: Report Mumble cache result
        env:
          VOICE_CACHE_HIT: ${{ steps.voice-cache.outputs.cache-hit }}
        run: |
          if ($env:VOICE_CACHE_HIT -eq 'true') {
            $message = 'Reusing compiled Mumble (${{ matrix.runtime }}); skipping native source checkout, toolchain restore and compilation.'
          } else {
            $message = 'No exact compiled Mumble cache (${{ matrix.runtime }}); building the pinned native inputs and caching the result.'
          }
          Write-Host $message
          $message >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux runtime and test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libnotify4 libasound2t64 \
            libsm6 libice6 libx11-xcb1 libxi6 libxrender1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-xinput0 \
            libxkbcommon-x11-0 libgl1 libopengl0 libegl1 xvfb xauth
      - name: Install Linux native build tools
        if: runner.os == 'Linux' && steps.voice-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libsm-dev \
            '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS' && steps.voice-cache.outputs.cache-hit != 'true'
        shell: bash
        run: brew install ninja xz
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup checksum mismatch.'
          }
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed: $($setup.ExitCode)" }
      - name: Restore native compiler toolchain
        if: steps.voice-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: artifacts/build-env
          key: native-${{ matrix.runtime }}-${{ hashFiles('packaging/native-dependencies.json') }}
      - name: Fetch pinned native sources and toolchain
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: ./scripts/prepare-release.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Build native voice
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-voice.ps1 -Parallel 3
      - name: Cache compiled native voice
        if: steps.voice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: artifacts/voice
          key: ${{ steps.voice-cache.outputs.cache-primary-key }}
      - name: Run managed and web tests
        run: |
          dotnet run --project tests/Strife.Tests -c Release
          if ($LASTEXITCODE) { throw 'Managed tests failed.' }
          npm ci
          if ($LASTEXITCODE) { throw 'npm restore failed.' }
          npm test
          if ($LASTEXITCODE) { throw 'Web tests failed.' }
      - name: Publish and package
        run: ./scripts/publish.ps1 -Runtime '${{ matrix.runtime }}' -Version $env:STRIFE_VERSION
      - name: Check packaged native engine
        run: ./scripts/test-package.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Test Windows installation, upgrade and removal
        if: runner.os == 'Windows'
        run: ./tests/windows/installer.ps1 -Installer (Join-Path $PWD "artifacts/release/Strife-$env:STRIFE_VERSION-win-x64-Setup.exe")
      - uses: actions/upload-artifact@v7
        with:
          name: Strife-${{ matrix.runtime }}
          overwrite: true
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.runtime }}
          overwrite: true
          path: |
            artifacts/installer-test/*.log
            artifacts/mumble-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  release:
    name: Attach release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Strife-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        shell: bash
        run: sha256sum Strife-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Strife-checksums
          overwrite: true
          path: release/SHA256SUMS.txt
      - name: Attach all packages to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/* --clobber
