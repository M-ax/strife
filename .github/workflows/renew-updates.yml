name: Renew update metadata
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Publish run containing the original signed Windows package
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  renew:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: Strife-win-x64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original
      - name: Authenticate original bytes and renew only metadata
        env:
          STRIFE_UPDATE_SIGNING_KEY: ${{ secrets.STRIFE_UPDATE_SIGNING_KEY }}
        run: node scripts/renew-update.mjs original
      - uses: actions/upload-artifact@v7
        with:
          name: Strife-renewed-update
          path: |
            original/windows-*.json
            original/*-full.nupkg
            original/update-requirements.json
          if-no-files-found: error
